name: release

# Publishing a release builds the tag it names and publishes the seven packages
# to npm. release-please.yml publishes the release when its release PR is
# merged.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm trusted publishing and provenance

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Build the tag the release names, not whatever main happens to be.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The tag reaches the shell through env, not interpolation: a tag name may
      # legally contain shell metacharacters.
      - name: Check the tag matches the package versions
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::Tag $TAG is not a version tag"; exit 1 ;;
          esac
          for p in core vue react svelte theme icons engine; do
            v=$(jq -r .version "packages/$p/package.json")
            if [ "v$v" != "$TAG" ]; then
              echo "::error::Tag $TAG does not match @inkbar/$p ($v)"
              exit 1
            fi
          done
      - uses: ./.github/actions/setup-qpdf
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @inkbar/core exec playwright install chromium
      - run: pnpm build
      - run: pnpm test
      # pnpm replaces `workspace:*` with the released version at publish time
      # and skips versions already on the registry, so a rerun finishes a
      # partial publish. Each package that is already on npm trusts this
      # workflow, so pnpm exchanges the job's OIDC token for a short-lived
      # publish token and no npm token is stored in the repository. npm sets up
      # that trust only for a package that exists, so a package new to npm
      # fails here and can stop the others. CONTRIBUTING.md#releasing lists
      # the manual first publish.
      - name: Publish
        run: >-
          pnpm -r
          --filter @inkbar/core --filter @inkbar/vue --filter @inkbar/react
          --filter @inkbar/svelte --filter @inkbar/theme --filter @inkbar/icons
          --filter @inkbar/engine
          publish --access public --provenance --no-git-checks

  # Asks inkbar/landing to draft this release's notes for the changelog page on
  # inkbar.dev. Its workflow opens a pull request with the draft for review. A
  # failure here leaves the npm publish as it is; run the landing workflow by
  # hand with the version instead.
  changelog:
    needs: publish
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.IB_APP_CLIENT_ID }}
          private-key: ${{ secrets.IB_APP_PRIVATE_KEY }}
          owner: inkbar
          repositories: landing
      # The tag reaches the shell through env, not interpolation.
      - name: Start the changelog draft
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: >-
          gh api repos/inkbar/landing/dispatches
          -f event_type=inkbar-release
          -f "client_payload[version]=${TAG#v}"
