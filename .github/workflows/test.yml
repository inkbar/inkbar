name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y qpdf
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y qpdf
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @inkbar/core exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm exec turbo run test:browser --filter='!@inkbar/sandbox-*'
      # The sandbox suites measure frame times. Each runs alone so nothing else competes for
      # the runner's CPU.
      - if: ${{ !cancelled() }}
        run: pnpm exec turbo run test:browser --filter=@inkbar/sandbox-vue
      - if: ${{ !cancelled() }}
        run: pnpm exec turbo run test:browser --filter=@inkbar/sandbox-react
      - if: ${{ !cancelled() }}
        run: pnpm exec turbo run test:browser --filter=@inkbar/sandbox-svelte
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          # Vitest browser mode writes failure screenshots under .vitest/attachments/.
          path: |
            packages/*/.vitest/attachments
            packages/*/test-results
            apps/*/test-results
            packages/*/src/**/__screenshots__
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
