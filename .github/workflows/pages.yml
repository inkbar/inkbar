name: pages

# Pages serves the gh-pages branch. Pushes to main publish the sandbox at its root; each pull
# request that can change the sandbox gets a preview under pr-preview/pr-<number>/, removed
# again when the pull request closes. public/CNAME keeps the custom domain on each publish.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed]
    paths:
      - apps/sandbox/**
      - packages/**
      - pnpm-lock.yaml
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Every run pushes to gh-pages, so runs queue rather than race.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    # A fork's token cannot push to gh-pages, so fork pull requests get no preview.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: github.event.action != 'closed'
        uses: pnpm/action-setup@v4
      - if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: github.event.action != 'closed'
        run: pnpm install --frozen-lockfile
      - if: github.event.action != 'closed'
        run: pnpm exec turbo run build --filter=@inkbar/sandbox...
        env:
          SANDBOX_BASE: ${{ github.event_name == 'pull_request' && format('/pr-preview/pr-{0}/', github.event.number) || '/' }}

      - if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: apps/sandbox/dist
          branch: gh-pages
          clean-exclude: pr-preview/

      - if: github.event_name == 'pull_request'
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: apps/sandbox/dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          pages-base-url: sandbox.inkbar.dev
