name: pages

# Pages serves the gh-pages branch. Pushes to main publish the sandbox at its root; each pull
# request that can change the sandbox gets a preview under pr-preview/pr-<number>/, removed
# again when the pull request closes.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed]
    paths:
      - apps/sandbox/**
      - packages/**
      - pnpm-lock.yaml
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# One group per pull request (and one for main). A single shared group dropped previews: GitHub
# keeps one pending run per group and cancels the rest, so pushing a stack of pull requests left
# most of them without one. Runs for different pull requests now build side by side; when two
# push to gh-pages at once, the deploy action rebases and pushes again. A newer push to the same
# pull request replaces its older run.
concurrency:
  group: pages-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    # A fork's token cannot push to gh-pages, so fork pull requests get no preview.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: github.event.action != 'closed'
        uses: pnpm/action-setup@v4
      - if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: github.event.action != 'closed'
        run: pnpm install --frozen-lockfile
      - if: github.event.action != 'closed'
        run: pnpm exec turbo run build --filter=@inkbar/sandbox...
        env:
          SANDBOX_BASE: ${{ github.event_name == 'pull_request' && format('/pr-preview/pr-{0}/', github.event.number) || '/' }}

      # Only the site root needs these. The deploy actions never delete CNAME or .nojekyll, so in
      # a preview they would outlive its removal. CNAME keeps the custom domain set.
      - if: github.event_name != 'pull_request'
        run: |
          echo sandbox.inkbar.dev > apps/sandbox/dist/CNAME
          touch apps/sandbox/dist/.nojekyll
      - if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: apps/sandbox/dist
          branch: gh-pages
          clean-exclude: pr-preview/
          # Previews push to the same branch alongside this deploy.
          attempt-limit: 10

      # The preview action rebases a rejected push three times. With a whole stack deploying at
      # once that can run out, so a failed attempt waits a moment and tries once more.
      - id: preview
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: apps/sandbox/dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          pages-base-url: sandbox.inkbar.dev
          qr-code: false
      - if: github.event_name == 'pull_request' && steps.preview.outcome == 'failure'
        run: sleep $((RANDOM % 30 + 15))
      - if: github.event_name == 'pull_request' && steps.preview.outcome == 'failure'
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: apps/sandbox/dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          pages-base-url: sandbox.inkbar.dev
          qr-code: false
