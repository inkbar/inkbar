name: Set up qpdf
description: Installs a pinned qpdf release from GitHub, so CI doesn't depend on the Ubuntu package mirrors.

runs:
  using: composite
  steps:
    - shell: bash
      env:
        QPDF_VERSION: 12.4.2
        QPDF_SHA256: db367d897829f22c4198ce1094143c9d467bd6ee7dfabc44ba6f02056b24f8b1
      run: |
        zip="qpdf-$QPDF_VERSION-bin-linux-x86_64.zip"
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/$zip" \
          "https://github.com/qpdf/qpdf/releases/download/v$QPDF_VERSION/$zip"
        echo "$QPDF_SHA256  $RUNNER_TEMP/$zip" | sha256sum -c -
        unzip -q "$RUNNER_TEMP/$zip" -d "$RUNNER_TEMP/qpdf"
        echo "$RUNNER_TEMP/qpdf/bin" >> "$GITHUB_PATH"
    - shell: bash
      run: qpdf --version
