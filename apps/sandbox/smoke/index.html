<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Inkbar smoke check</title>
    <style>
      body {
        margin: 0;
        padding: 12px;
        background: #fff;
        color: #111;
        font:
          14px/1.4 system-ui,
          sans-serif;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 16px;
      }
      [data-smoke-results] {
        margin: 0 0 12px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font:
          12px/1.4 ui-monospace,
          monospace;
      }
      [data-smoke-viewer] {
        display: flex;
        flex-direction: column;
        height: 680px;
        border: 1px solid #ccc;
      }
      [data-smoke-viewer] > [data-ink-root] {
        display: flex;
        flex: 1 1 auto;
        flex-direction: column;
        min-height: 0;
      }
      [data-smoke-viewer] .ink-viewport-root {
        flex: 1 1 auto;
        min-height: 0;
      }
      /* Thumbnails and the outline, side by side under the pages. */
      .smoke-panels {
        display: grid;
        flex: none;
        grid-template-columns: 1fr 1fr;
        height: 180px;
        border-top: 1px solid #ccc;
      }
      .smoke-panels > * {
        min-width: 0;
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <h1>Inkbar smoke check</h1>
    <pre data-smoke-results aria-live="polite"></pre>
    <div data-smoke-viewer></div>
    <script type="module" src="/src/smoke/main.ts"></script>
  </body>
</html>
