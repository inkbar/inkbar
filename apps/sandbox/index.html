<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Try the Inkbar PDF viewer and editor in React, Vue, Svelte and plain TypeScript, one scenario at a time."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Inkbar sandbox</title>
    <script>
      // A French or German address names the page's language before anything renders.
      ;(function () {
        var lang = new URLSearchParams(location.search).get('lang')
        if (lang === 'fr' || lang === 'de') document.documentElement.lang = lang
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/shell/app.ts"></script>
  </body>
</html>
